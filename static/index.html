<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageCharts">CloudWatcher</title>
  <script src="/static/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    html {
      min-height: 100%;
      background: #071018 url("/static/backdrop.jpg") center center / cover no-repeat fixed;
    }
    body {
      margin: 0 auto;
      max-width: 960px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #eef3f8;
      background: transparent;
    }
    .sticky-head {
      position: sticky;
      top: 0;
      z-index: 8;
      margin: -16px -16px 0;
      padding: 16px 16px 28px;
      background: #071018 url("/static/backdrop.jpg") center center / cover no-repeat fixed;
    }
    #safe-dock { margin-bottom: 0; }
    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { height: 2rem; width: auto; display: block; }
    h1 { font-size: 2rem; line-height: 1; margin: 0; color: #f4f7fb; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
    .live, .count { color: #f4f7fb; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85); }
    .live { display: flex; align-items: center; gap: 8px; margin: 0; font-variant-numeric: tabular-nums; }
    .led {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35);
    }
    .led.green { color: #1f9d3a; box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35), 0 0 8px #1f9d3a; }
    .led.yellow { color: #e0a100; box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35), 0 0 8px #e0a100; }
    .led.red { color: #d1242f; box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35), 0 0 8px #d1242f; }
    .led.off { color: #8b95a3; box-shadow: none; }
    .flags { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .binary-track { position: relative; height: 22px; background: rgba(255, 255, 255, 0.12); border-radius: 6px; overflow: hidden; }
    .binary-track .seg { position: absolute; top: 0; bottom: 0; }
    .binary-track .seg.on { background: #1f9d3a; }
    .binary-track .seg.off { background: #d1242f; }
    .binary-axis { display: flex; justify-content: space-between; margin-top: 4px; color: #d5dbe3; font-size: 12px; }
    .reading.on { color: #5dce73; }
    .reading.off { color: #ff6b74; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    #safe-dock .chart-card { margin-bottom: 0; }
    button, input[type="date"], input.date-text {
      box-sizing: border-box;
      font: inherit;
      font-size: 16px;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #6d7d90;
      border-radius: 8px;
      background: #152033;
      color: #eef3f8;
    }
    button { cursor: pointer; }
    .count { margin: 0; font-variant-numeric: tabular-nums; }
    #status { margin: 0 0 12px; }
    #status:empty { display: none; }
    .chart-card {
      background: linear-gradient(to bottom, rgba(12, 20, 34, 0.97), rgba(32, 52, 80, 0.97));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .chart-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .chart-led { flex: 0 0 auto; }
    .chart-head h2 { font-size: 1rem; margin: 0; font-weight: 600; flex: 1; }
    button.info {
      width: 18px;
      height: 18px;
      min-height: 0;
      margin-left: 6px;
      padding: 0;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      color: #d6e6ff;
      background: #152033;
      border-color: #8fb4e0;
      vertical-align: 1px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.45);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: min(32rem, 100%);
      background: #121a28;
      color: #eef3f8;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 16px;
    }
    .modal-card h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .modal-card p { margin: 0 0 16px; line-height: 1.45; }
    .reading { font-weight: 500; color: #9ecbff; margin-left: 8px; }
    .order { display: flex; gap: 4px; margin-left: auto; }
    .order button { height: 36px; min-width: 40px; padding: 0 8px; }
    a.nav { align-self: center; color: #d6e8ff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85); }
    .chart-box { position: relative; height: 220px; }
    .empty {
      background: rgba(8, 16, 28, 0.88);
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      color: #eef3f8;
    }
    .credit, .credit a {
      color: #c8cdd4;
      font-size: 12px;
      text-align: center;
    }
    .credit { margin: 28px 0 8px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
    .credit a { text-decoration: underline; }
    .date-control { position: relative; display: inline-flex; align-items: center; }
    .date-control .date-text,
    .date-control .date-pick,
    .date-control .date-pop { display: none; }
    .date-control.de .date-text { display: block; width: 8.5rem; border-radius: 8px 0 0 8px; }
    .date-control.de .date-pick { display: inline-flex; align-items: center; justify-content: center; width: 44px; border-radius: 0 8px 8px 0; margin-left: -1px; }
    .date-control.de input[type="date"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .date-pop {
      position: absolute;
      top: 48px;
      left: 0;
      z-index: 30;
      width: 16.5rem;
      padding: 8px;
      background: #121a28;
      color: #eef3f8;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
    }
    .date-control.de .date-pop.open { display: block; }
    .date-pop-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .date-pop-head span { flex: 1; text-align: center; text-transform: capitalize; }
    .date-pop button { height: 32px; min-width: 0; padding: 0; font-size: 14px; }
    .date-pop-head button { width: 32px; }
    .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .date-dow { text-align: center; font-size: 12px; color: #c8cdd4; line-height: 32px; }
    .date-grid button.selected { background: #1f4e79; }
    .date-grid button.today { border-color: #9ecbff; }
  </style>
</head>
<body>
  <div class="sticky-head">
  <div class="top">
    <div class="brand">
      <img class="logo" src="/static/logo.png" alt="">
      <h1>CloudWatcher</h1>
    </div>
    <div class="flags">
      <p class="count" id="count"></p>
      <p class="live"><span id="led-safe" class="led off" aria-hidden="true"></span><span id="text-safe" data-i18n="safeUnknown">Safe —</span></p>
      <p class="live"><span id="led-switch" class="led off" aria-hidden="true"></span><span id="text-switch" data-i18n="switchUnknown">Switch —</span></p>
      <p class="live"><span id="led" class="led red" aria-hidden="true"></span><span id="last-message" data-i18n="noMessage">no message</span></p>
    </div>
  </div>
  <div class="toolbar">
    <button type="button" id="prev" data-i18n="prev">Previous day</button>
    <div class="date-control" id="date-control">
      <input type="text" id="date-text" class="date-text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" placeholder="TT.MM.JJJJ" data-i18n-aria="date" aria-label="Datum">
      <button type="button" id="date-pick" class="date-pick" data-i18n-aria="calendar" aria-label="Kalender">▾</button>
      <div id="date-pop" class="date-pop"></div>
      <input type="date" id="date" data-i18n-aria="date" aria-label="Date">
    </div>
    <button type="button" id="today" data-i18n="today">Today</button>
    <a class="nav" href="/config" data-i18n="settings">Settings</a>
  </div>
  <p id="status"></p>
  <div id="safe-dock"></div>
  </div>
  <main id="charts"></main>
  <div id="info-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <h2 id="info-title"></h2>
      <p id="info-body"></p>
      <button type="button" id="info-close" data-i18n="close">Close</button>
    </div>
  </div>
  <p class="credit">Photo by <a href="https://unsplash.com/@scottagoodwill?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Scott Goodwill</a> on <a href="https://unsplash.com/photos/night-sky-with-milky-way-observatory-and-people-stargazing-dU4dX1l0UFM?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
  <script src="/static/i18n.js"></script>
  <script>
    applyI18n();
    syncDateControl();
    // Combine fields into one chart once a sample message documents the schema.
    var FIELD_GROUPS = [{ title: "Wind", fields: ["wind", "gust"] }];
    var COLORS = ["#8ec5ff", "#f0a36a", "#7dce72", "#c9a0f0", "#7fd0d8"];
    var charts = [];
    var settings = { order: [], hidden: [], lang: "", limits: {} };
    var lastPayload = null;

    function todayBerlin() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Berlin",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function isoToGerman(iso) {
      var parts = String(iso || "").split("-");
      if (parts.length !== 3) return "";
      return parts[2] + "." + parts[1] + "." + parts[0];
    }

    function germanToIso(text) {
      var match = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(text || "").trim());
      if (!match) return "";
      var day = Number(match[1]);
      var month = Number(match[2]);
      var year = Number(match[3]);
      var dt = new Date(Date.UTC(year, month - 1, day));
      if (dt.getUTCFullYear() !== year || dt.getUTCMonth() !== month - 1 || dt.getUTCDate() !== day) return "";
      return year + "-" + pad2(month) + "-" + pad2(day);
    }

    function syncDateControl() {
      var box = document.getElementById("date-control");
      if (!box) return;
      var german = currentLang() === "de";
      box.classList.toggle("de", german);
      var native = document.getElementById("date");
      native.tabIndex = german ? -1 : 0;
      if (german) native.setAttribute("aria-hidden", "true");
      else native.removeAttribute("aria-hidden");
      var iso = native.value;
      if (iso) document.getElementById("date-text").value = isoToGerman(iso);
    }

    var popMonth = { y: 2026, m: 0 };

    function closeDatePop() {
      document.getElementById("date-pop").classList.remove("open");
    }

    function renderDatePop() {
      var pop = document.getElementById("date-pop");
      pop.textContent = "";
      var year = popMonth.y;
      var month = popMonth.m;
      var head = document.createElement("div");
      head.className = "date-pop-head";
      var prev = document.createElement("button");
      prev.type = "button";
      prev.textContent = "‹";
      prev.addEventListener("click", function (event) {
        event.stopPropagation();
        popMonth.m -= 1;
        if (popMonth.m < 0) { popMonth.m = 11; popMonth.y -= 1; }
        renderDatePop();
      });
      var label = document.createElement("span");
      label.textContent = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(new Date(year, month, 1));
      var next = document.createElement("button");
      next.type = "button";
      next.textContent = "›";
      next.addEventListener("click", function (event) {
        event.stopPropagation();
        popMonth.m += 1;
        if (popMonth.m > 11) { popMonth.m = 0; popMonth.y += 1; }
        renderDatePop();
      });
      head.appendChild(prev);
      head.appendChild(label);
      head.appendChild(next);
      var grid = document.createElement("div");
      grid.className = "date-grid";
      ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].forEach(function (name) {
        var cell = document.createElement("span");
        cell.className = "date-dow";
        cell.textContent = name;
        grid.appendChild(cell);
      });
      var pad = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
      var count = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      var selected = document.getElementById("date").value;
      var today = todayBerlin();
      var i;
      for (i = 0; i < pad; i++) grid.appendChild(document.createElement("span"));
      for (var day = 1; day <= count; day++) {
        var iso = year + "-" + pad2(month + 1) + "-" + pad2(day);
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = String(day);
        if (iso === selected) button.classList.add("selected");
        if (iso === today) button.classList.add("today");
        button.addEventListener("click", function (picked) {
          return function (event) {
            event.stopPropagation();
            closeDatePop();
            load(picked);
          };
        }(iso));
        grid.appendChild(button);
      }
      pop.appendChild(head);
      pop.appendChild(grid);
    }

    function openDatePop() {
      var iso = document.getElementById("date").value || todayBerlin();
      var parts = iso.split("-").map(Number);
      popMonth = { y: parts[0], m: parts[1] - 1 };
      renderDatePop();
      document.getElementById("date-pop").classList.add("open");
    }

    function commitGermanDate() {
      var iso = germanToIso(document.getElementById("date-text").value);
      if (!iso) {
        document.getElementById("date-text").value = isoToGerman(document.getElementById("date").value);
        return;
      }
      if (iso !== document.getElementById("date").value) load(iso);
    }

    function shift(dateStr, days) {
      var parts = dateStr.split("-").map(Number);
      var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().slice(0, 10);
    }

    function hiddenSet() {
      return new Set(settings.hidden || []);
    }

    function formatHour(h) {
      if (h == null || isNaN(h)) return "";
      var shifted = h >= 24 ? 12 : (h + 12) % 24;
      var totalMin = Math.round(shifted * 60);
      if (totalMin >= 24 * 60) totalMin = 0;
      var hh = Math.floor(totalMin / 60);
      var mm = totalMin % 60;
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function withGaps(points) {
      var gap = 2 / 60;
      var out = [];
      var prev = null;
      points.forEach(function (p) {
        if (prev !== null && p[0] - prev > gap) {
          out.push({ x: prev + gap / 2, y: null });
        }
        out.push({ x: p[0], y: p[1] });
        prev = p[0];
      });
      return out;
    }

    function destroyCharts() {
      charts.forEach(function (chart) { if (chart) chart.destroy(); });
      charts = [];
    }

    function isBinary(name) {
      return name === "safe" || name === "switch";
    }

    function stateWord(name, value) {
      var on = value >= 0.5;
      if (name === "safe") return on ? t("safeOn") : t("safeOff");
      if (name === "switch") return on ? t("switchOn") : t("switchOff");
      return on ? "1" : "0";
    }

    function binaryRuns(points) {
      var runs = [];
      if (!points || !points.length) return runs;
      var gap = 2 / 60;
      var start = points[0][0];
      var bit = points[0][1] >= 0.5 ? 1 : 0;
      var prev = start;
      for (var i = 1; i < points.length; i++) {
        var hour = points[i][0];
        var next = points[i][1] >= 0.5 ? 1 : 0;
        if (hour - prev > gap) {
          runs.push({ start: start, end: prev, value: bit });
          start = hour;
          bit = next;
        } else if (next !== bit) {
          runs.push({ start: start, end: hour, value: bit });
          start = hour;
          bit = next;
        }
        prev = hour;
      }
      runs.push({ start: start, end: prev, value: bit });
      return runs;
    }

    function fillBinary(track, points) {
      track.textContent = "";
      binaryRuns(points).forEach(function (run) {
        var end = run.end <= run.start ? Math.min(24, run.start + 0.15) : run.end;
        var seg = document.createElement("div");
        seg.className = "seg " + (run.value ? "on" : "off");
        seg.style.left = (run.start / 24 * 100) + "%";
        seg.style.width = (Math.max(0, end - run.start) / 24 * 100) + "%";
        track.appendChild(seg);
      });
    }

    function paintFlags(series) {
      [["safe", "Safe", "led-safe", "text-safe"], ["switch", "Switch", "led-switch", "text-switch"]].forEach(function (spec) {
        var led = document.getElementById(spec[2]);
        var label = document.getElementById(spec[3]);
        var value = series ? lastReading(series[spec[0]]) : null;
        if (value == null || isNaN(value)) {
          led.className = "led off";
          label.textContent = t(spec[0] + "Unknown");
          return;
        }
        var on = value >= 0.5;
        led.className = "led " + (on ? "green" : "red");
        label.textContent = spec[0] === "safe"
          ? t(on ? "safeStateOn" : "safeStateOff")
          : fieldTitle(spec[0], spec[1]) + " " + stateWord(spec[0], value);
      });
    }

    function orderedNames(names) {
      var rank = {};
      (settings.order || []).forEach(function (name, index) { rank[name] = index; });
      return names.slice().sort(function (a, b) {
        var ra = Object.prototype.hasOwnProperty.call(rank, a) ? rank[a] : 10000;
        var rb = Object.prototype.hasOwnProperty.call(rank, b) ? rank[b] : 10000;
        if (ra !== rb) return ra - rb;
        return a < b ? -1 : a > b ? 1 : 0;
      });
    }

    function chartGroups(series) {
      var keys = orderedNames(Object.keys(series));
      var used = {};
      var groups = [];
      FIELD_GROUPS.forEach(function (group) {
        var present = group.fields.filter(function (name) {
          return Object.prototype.hasOwnProperty.call(series, name);
        });
        if (!present.length) return;
        present.forEach(function (name) { used[name] = true; });
        groups.push({ title: group.title, fields: present });
      });
      keys.forEach(function (name) {
        if (!used[name]) groups.push({ title: name, fields: [name] });
      });
      var rank = {};
      var source = settings.order && settings.order.length ? settings.order : keys;
      source.forEach(function (name, index) { rank[name] = index; });
      function groupRank(group) {
        var best = 10000;
        group.fields.forEach(function (name) {
          if (Object.prototype.hasOwnProperty.call(rank, name) && rank[name] < best) best = rank[name];
        });
        return best;
      }
      groups.sort(function (a, b) { return groupRank(a) - groupRank(b); });
      return groups;
    }

    function formatReading(value) {
      if (value == null || isNaN(value)) return "";
      var abs = Math.abs(value);
      var digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      return value.toFixed(digits);
    }

    function lastReading(points) {
      if (!points || !points.length) return null;
      return points[points.length - 1][1];
    }

    function fieldSpec(name) {
      var spec = (settings.limits || {})[name] || {};
      var lines = (spec.lines || []).filter(function (line) {
        return line.value != null && line.value !== "" && isFinite(Number(line.value));
      }).map(function (line) {
        return { id: line.id, label: line.label, value: Number(line.value), color: line.color || "#666" };
      });
      var ymin = spec.ymin == null || spec.ymin === "" ? null : Number(spec.ymin);
      var ymax = spec.ymax == null || spec.ymax === "" ? null : Number(spec.ymax);
      if (ymin != null && !isFinite(ymin)) ymin = null;
      if (ymax != null && !isFinite(ymax)) ymax = null;
      return { lines: lines, ymin: ymin, ymax: ymax, unit: spec.unit || "" };
    }

    function visibleLimit(points, spec) {
      var fixedMin = spec.ymin != null;
      var fixedMax = spec.ymax != null;
      if (fixedMin && fixedMax) {
        return {
          lines: spec.lines.filter(function (line) {
            return line.value >= spec.ymin && line.value <= spec.ymax;
          }),
          min: spec.ymin,
          max: spec.ymax
        };
      }
      var ys = [];
      (points || []).forEach(function (point) {
        if (point[1] != null && isFinite(point[1])) ys.push(point[1]);
      });
      if (!ys.length) return { lines: [], min: undefined, max: undefined };
      var dataMin = Math.min.apply(null, ys);
      var dataMax = Math.max.apply(null, ys);
      var span = Math.max(dataMax - dataMin, 1);
      var pad = Math.max(span * 8, 50, Math.abs(dataMax) * 0.2);
      var lo = fixedMin ? spec.ymin : dataMin;
      var hi = fixedMax ? spec.ymax : dataMax;
      var kept = spec.lines.filter(function (line) {
        return line.value >= (fixedMin ? lo : dataMin - pad) && line.value <= (fixedMax ? hi : dataMax + pad);
      });
      if (!fixedMin || !fixedMax) {
        kept.forEach(function (line) {
          if (!fixedMin) lo = Math.min(lo, line.value);
          if (!fixedMax) hi = Math.max(hi, line.value);
        });
      }
      var extra = Math.max((hi - lo) * 0.06, 0.5);
      return {
        lines: kept,
        min: fixedMin ? spec.ymin : lo - extra,
        max: fixedMax ? spec.ymax : hi + extra
      };
    }

    function alarmLimit(name) {
      var lines = fieldSpec(name).lines;
      var unsafe = null;
      var red = null;
      lines.forEach(function (line) {
        if (line.id === "unsafe" && isFinite(line.value)) unsafe = line.value;
        if (String(line.color).toLowerCase() === "#d1242f" && isFinite(line.value) && Math.abs(line.value) < 900) red = line.value;
      });
      return unsafe != null ? unsafe : red;
    }

    function switchLimit(name) {
      var value = null;
      fieldSpec(name).lines.forEach(function (line) {
        if (line.id === "unsafe" && isFinite(line.value)) value = line.value;
      });
      return value;
    }

    function switchExceeded(name, value) {
      var limit = switchLimit(name);
      if (limit == null || value == null || isNaN(value)) return false;
      if (name === "rain" || name === "light") return value < limit;
      return value > limit;
    }

    function exceededRuns(name, points) {
      var runs = [];
      if (!points || !points.length || switchLimit(name) == null) return runs;
      var gap = 2 / 60;
      var minWidth = 1.5 / 60;
      var active = null;
      var prev = null;
      points.forEach(function (point) {
        var hour = point[0];
        if (prev !== null && hour - prev > gap && active) {
          runs.push(active);
          active = null;
        }
        if (switchExceeded(name, point[1])) {
          if (!active) active = { start: hour, end: hour };
          else active.end = hour;
        } else if (active) {
          runs.push(active);
          active = null;
        }
        prev = hour;
      });
      if (active) runs.push(active);
      return runs.map(function (run) {
        return { start: run.start, end: run.end <= run.start ? run.start + minWidth : run.end };
      });
    }

    function mergeRuns(runs) {
      var out = [];
      runs.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (run) {
        var last = out[out.length - 1];
        if (last && run.start <= last.end) last.end = Math.max(last.end, run.end);
        else out.push({ start: run.start, end: run.end });
      });
      return out;
    }

    function switchRunsFor(group, series) {
      var runs = [];
      group.fields.forEach(function (name) {
        exceededRuns(name, series[name]).forEach(function (run) { runs.push(run); });
      });
      return mergeRuns(runs);
    }

    var SWITCH_PINK = "rgba(196, 128, 136, 0.62)";
    Chart.register({
      id: "switchBands",
      beforeDatasetsDraw: function (chart) {
        var opts = chart.options.plugins && chart.options.plugins.switchBands;
        var runs = opts && opts.runs;
        var area = chart.chartArea;
        var xScale = chart.scales.x;
        if (!runs || !runs.length || !area || !xScale) return;
        var ctx = chart.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.rect(area.left, area.top, area.right - area.left, area.bottom - area.top);
        ctx.clip();
        ctx.fillStyle = SWITCH_PINK;
        runs.forEach(function (run) {
          var x0 = xScale.getPixelForValue(run.start);
          var x1 = xScale.getPixelForValue(run.end);
          if (x1 < x0) { var swap = x0; x0 = x1; x1 = swap; }
          if (x1 - x0 < 2) x1 = x0 + 2;
          ctx.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);
        });
        ctx.restore();
      }
    });

    function readingOutside(name, value) {
      if (value == null || isNaN(value)) return null;
      if (name === "safe" || name === "switch") return value < 0.5;
      var limit = alarmLimit(name);
      if (limit == null) return null;
      if (name === "rain" || name === "light") return value < limit;
      return value > limit;
    }

    function chartLedState(group, series) {
      var known = false;
      var outside = false;
      group.fields.forEach(function (name) {
        var state = readingOutside(name, lastReading(series[name]));
        if (state == null) return;
        known = true;
        if (state) outside = true;
      });
      if (!known) return "off";
      return outside ? "red" : "green";
    }

    function paintChartLed(led, group, series) {
      var state = chartLedState(group, series);
      led.className = "led chart-led " + state;
      var label = state === "red" ? t("limitOut") : state === "green" ? t("limitIn") : t("limitUnknown");
      led.setAttribute("role", "img");
      led.setAttribute("aria-label", label);
      led.title = label;
    }

    function readingText(group, series) {
      return group.fields.map(function (name) {
        var value = lastReading(series[name]);
        if (value == null || isNaN(value)) return "";
        if (isBinary(name)) return stateWord(name, value);
        var text = formatReading(value);
        var unit = fieldSpec(name).unit;
        var prefix = "";
        if (group.fields.length > 1) {
          prefix = name === "gust" ? fieldTitle("gust", "Gusts") + " " : name === "wind" ? "" : fieldTitle(name, name) + " ";
        }
        return prefix + text + (unit ? " " + unit : "");
      }).filter(Boolean).join(" · ");
    }

    function limitDatasets(field, lines, maxX) {
      return lines.map(function (line) {
        return {
          label: limitName(field, line.id, line.label),
          data: [{ x: 0, y: line.value }, { x: maxX, y: line.value }],
          borderColor: line.color,
          borderDash: [6, 4],
          borderWidth: 1.5,
          pointRadius: 0,
          spanGaps: true,
          tension: 0,
          order: 2
        };
      });
    }

    function renderCharts(series, hidden) {
      destroyCharts();
      var root = document.getElementById("charts");
      var dock = document.getElementById("safe-dock");
      root.textContent = "";
      dock.textContent = "";
      var visibleGroups = chartGroups(series).filter(function (group) {
        return group.fields.some(function (name) { return !hidden.has(name); });
      }).map(function (group) {
        return {
          title: group.title,
          fields: group.fields.filter(function (name) { return !hidden.has(name); })
        };
      });
      if (!visibleGroups.length) {
        chartSignature = "";
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = t("noFieldsSelected");
        root.appendChild(empty);
        return;
      }
      var maxX = 24;
      visibleGroups.forEach(function (group, groupIndex) {
        var card = document.createElement("section");
        card.className = "chart-card";
        card.dataset.field = group.fields[0];
        var head = document.createElement("div");
        head.className = "chart-head";
        var led = document.createElement("span");
        paintChartLed(led, group, series);
        head.appendChild(led);
        var title = document.createElement("h2");
        title.appendChild(document.createTextNode(chartTitle(group)));
        var info = document.createElement("button");
        info.type = "button";
        info.className = "info";
        info.textContent = "i";
        info.setAttribute("aria-label", t("info"));
        info.addEventListener("click", function () { openInfo(infoKey(group)); });
        title.appendChild(info);
        var reading = document.createElement("span");
        reading.className = "reading";
        reading.textContent = readingText(group, series);
        if (group.fields.length === 1 && isBinary(group.fields[0])) {
          var bit = lastReading(series[group.fields[0]]);
          if (bit != null) reading.classList.add(bit >= 0.5 ? "on" : "off");
        }
        title.appendChild(reading);
        head.appendChild(title);
        if (group.fields[0] !== "safe") {
          var order = document.createElement("div");
          order.className = "order";
          [["up", "up", "↑", -1], ["down", "down", "↓", 1]].forEach(function (spec) {
            var button = document.createElement("button");
            button.type = "button";
            button.dataset.dir = spec[0];
            button.setAttribute("aria-label", t(spec[1]));
            button.textContent = spec[2];
            button.disabled = (spec[3] < 0 && groupIndex === 0) || (spec[3] > 0 && groupIndex === visibleGroups.length - 1);
            button.addEventListener("click", function () { moveField(group.fields[0], spec[3]); });
            order.appendChild(button);
          });
          head.appendChild(order);
        }
        card.appendChild(head);
        if (group.fields.length === 1 && isBinary(group.fields[0])) {
          card.dataset.binary = "1";
          var track = document.createElement("div");
          track.className = "binary-track";
          fillBinary(track, series[group.fields[0]]);
          var axis = document.createElement("div");
          axis.className = "binary-axis";
          [0, 4, 8, 12, 16, 20, 24].forEach(function (hour) {
            var tick = document.createElement("span");
            tick.textContent = formatHour(hour).slice(0, 2);
            axis.appendChild(tick);
          });
          card.appendChild(track);
          card.appendChild(axis);
          (group.fields[0] === "safe" ? dock : root).appendChild(card);
          charts.push(null);
          return;
        }
        var box = document.createElement("div");
        box.className = "chart-box";
        var canvas = document.createElement("canvas");
        box.appendChild(canvas);
        card.appendChild(box);
        (group.fields[0] === "safe" ? dock : root).appendChild(card);
        var points = [];
        group.fields.forEach(function (name) {
          (series[name] || []).forEach(function (point) { points.push(point); });
        });
        var spec = fieldSpec(group.fields[0]);
        var scale = visibleLimit(points, spec);
        var datasets = group.fields.map(function (name, index) {
          if (name === "gust") {
            return {
              label: fieldTitle("gust", "Gusts"),
              data: (series[name] || []).map(function (point) { return { x: point[0], y: point[1] }; }),
              borderColor: "#e0a100",
              backgroundColor: "#e0a100",
              pointRadius: 1,
              pointHoverRadius: 1,
              pointBorderWidth: 0,
              pointHitRadius: 8,
              showLine: false,
              order: 1
            };
          }
          var color = COLORS[index % COLORS.length];
          return {
            label: fieldTitle(name, name),
            data: withGaps(series[name]),
            borderColor: color,
            backgroundColor: color,
            spanGaps: false,
            pointRadius: 0,
            borderWidth: 1.5,
            tension: 0,
            order: 0
          };
        }).concat(limitDatasets(group.fields[0], scale.lines, maxX));
        var yScale = {
          beginAtZero: false,
          ticks: { color: "#d5dbe3" },
          grid: { color: "rgba(255,255,255,0.16)" },
          border: { color: "rgba(255,255,255,0.28)" }
        };
        if (scale.min != null) yScale.min = scale.min;
        if (scale.max != null) yScale.max = scale.max;
        if (group.fields.every(function (name) { return name === "light" || name === "rain"; })) {
          yScale.reverse = true;
        }
        charts.push(new Chart(canvas, {
          type: "line",
          data: { datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              switchBands: { runs: switchRunsFor(group, series) },
              legend: { display: datasets.length > 1, labels: { color: "#d5dbe3" } },
              tooltip: {
                callbacks: {
                  title: function (items) { return formatHour(items[0].parsed.x); }
                }
              }
            },
            scales: {
              x: {
                type: "linear",
                min: 0,
                max: maxX,
                ticks: { stepSize: 4, color: "#d5dbe3", callback: formatHour },
                grid: { color: "rgba(255,255,255,0.16)" },
                border: { color: "rgba(255,255,255,0.28)" }
              },
              y: yScale
            }
          }
        }));
      });
      chartSignature = signatureFor(series, hidden);
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function infoKey(group) {
      if (group.fields.indexOf("wind") !== -1) return "wind";
      return group.fields[0];
    }

    function openInfo(key) {
      var modal = document.getElementById("info-modal");
      var bodyKey = "info." + key;
      var body = t(bodyKey);
      document.getElementById("info-title").textContent = fieldTitle(key, key);
      document.getElementById("info-body").textContent = body === bodyKey ? t("info.unknown") : body;
      document.getElementById("info-close").textContent = t("close");
      modal.hidden = false;
      document.getElementById("info-close").focus();
    }

    function closeInfo() {
      document.getElementById("info-modal").hidden = true;
    }

    function chartTitle(group) {
      if (group.fields.indexOf("wind") !== -1 && group.fields.indexOf("gust") !== -1) {
        return fieldTitle("wind", group.title);
      }
      return fieldTitle(group.fields[0], group.title);
    }

    function setCount(payload) {
      var text = payload.received + " " + t("messages");
      if (payload.skipped) text += ", " + payload.skipped + " " + t("unreadable");
      document.getElementById("count").textContent = text;
    }

    var currentSeries = {};
    var chartSignature = "";
    var lastMessageAt = null;

    function paintLed() {
      var led = document.getElementById("led");
      var label = document.getElementById("last-message");
      if (lastMessageAt == null || isNaN(lastMessageAt)) {
        led.className = "led red";
        label.textContent = t("noMessage");
        return;
      }
      var age = Date.now() - lastMessageAt;
      var state = age < 60000 ? "green" : age < 120000 ? "yellow" : "red";
      led.className = "led " + state;
      label.textContent = formatStamp(new Date(lastMessageAt));
    }

    function visibleGroups(series, hidden) {
      return chartGroups(series).filter(function (group) {
        return group.fields.some(function (name) { return !hidden.has(name); });
      }).map(function (group) {
        return {
          title: group.title,
          fields: group.fields.filter(function (name) { return !hidden.has(name); })
        };
      });
    }

    function signatureFor(series, hidden) {
      return visibleGroups(series, hidden).map(function (group) {
        return group.title + "=" + group.fields.join(",");
      }).join("|");
    }

    function axisMax() {
      return 24;
    }

    function updateCharts(series, hidden) {
      var groups = visibleGroups(series, hidden);
      var maxX = axisMax(series);
      groups.forEach(function (group, index) {
        var card = document.querySelector('.chart-card[data-field="' + group.fields[0] + '"]');
        var led = card ? card.querySelector(".chart-led") : null;
        if (led) paintChartLed(led, group, series);
        var reading = card ? card.querySelector(".reading") : null;
        if (reading) {
          reading.textContent = readingText(group, series);
          reading.classList.remove("on", "off");
          if (group.fields.length === 1 && isBinary(group.fields[0])) {
            var bit = lastReading(series[group.fields[0]]);
            if (bit != null) reading.classList.add(bit >= 0.5 ? "on" : "off");
          }
        }
        if (card && card.dataset.binary) {
          fillBinary(card.querySelector(".binary-track"), series[group.fields[0]]);
          return;
        }
        var chart = charts[index];
        if (!chart) return;
        if (chart.options.plugins.switchBands) {
          chart.options.plugins.switchBands.runs = switchRunsFor(group, series);
        }
        group.fields.forEach(function (name, fieldIndex) {
          chart.data.datasets[fieldIndex].data = name === "gust"
            ? (series[name] || []).map(function (point) { return { x: point[0], y: point[1] }; })
            : withGaps(series[name]);
        });
        for (var lineIndex = group.fields.length; lineIndex < chart.data.datasets.length; lineIndex++) {
          var line = chart.data.datasets[lineIndex];
          if (line.data[0]) line.data[0].x = 0;
          if (line.data[1]) line.data[1].x = maxX;
        }
        chart.options.scales.x.max = maxX;
        chart.update();
      });
    }

    function moveField(name, dir) {
      var hidden = hiddenSet();
      var groups = visibleGroups(currentSeries, hidden);
      var index = -1;
      groups.forEach(function (group, i) {
        if (group.fields.indexOf(name) !== -1) index = i;
      });
      var target = index + dir;
      if (index < 0 || target < 0 || target >= groups.length) return;
      var moved = groups.splice(index, 1)[0];
      groups.splice(target, 0, moved);
      var order = [];
      groups.forEach(function (group) {
        group.fields.forEach(function (field) { order.push(field); });
      });
      Object.keys(currentSeries).forEach(function (field) {
        if (order.indexOf(field) === -1) order.push(field);
      });
      chartSignature = "";
      saveSettings({ order: order }).then(function () {
        if (lastPayload) showPayload(lastPayload);
      });
    }

    function saveSettings(partial) {
      return fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(partial)
      }).then(function (response) {
        if (!response.ok) throw new Error(t("saveFailed"));
        return response.json();
      }).then(function (body) {
        settings = body;
        return body;
      });
    }

    function showPayload(payload) {
      var names = orderedNames(Object.keys(payload.series));
      var hidden = hiddenSet();
      currentSeries = payload.series;
      lastPayload = payload;
      if (payload.last_message) lastMessageAt = Date.parse(payload.last_message);
      paintLed();
      paintFlags(payload.received === 0 ? null : payload.series);
      setCount(payload);
      setStatus("");
      if (payload.received === 0) {
        chartSignature = "";
        destroyCharts();
        var root = document.getElementById("charts");
        root.textContent = "";
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = t("noData");
        root.appendChild(empty);
        return;
      }
      if (!names.length) {
        chartSignature = "";
        destroyCharts();
        var box = document.getElementById("charts");
        box.textContent = "";
        var note = document.createElement("p");
        note.className = "empty";
        note.textContent = t("noNumbers");
        box.appendChild(note);
        return;
      }
      var signature = signatureFor(payload.series, hidden);
      if (signature && signature === chartSignature && charts.length) {
        updateCharts(payload.series, hidden);
        return;
      }
      renderCharts(payload.series, hidden);
      chartSignature = signatureFor(currentSeries, hidden);
    }

    function formatStamp(date) {
      var parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Berlin",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      var map = {};
      parts.forEach(function (part) { map[part.type] = part.value; });
      var sep = currentLang() === "de" ? "." : "/";
      return map.day + sep + map.month + sep + map.year + ", " + map.hour + ":" + map.minute + ":" + map.second;
    }

    function load(date, quiet) {
      document.getElementById("date").value = date;
      document.getElementById("date-text").value = isoToGerman(date);
      if (!quiet) setStatus(t("loading"));
      fetch("/api/data?date=" + encodeURIComponent(date))
        .then(function (response) {
          if (!response.ok) throw new Error(t("queryFailed") + " (" + response.status + ")");
          return response.json();
        })
        .then(function (payload) {
          if (document.getElementById("date").value !== date) return;
          showPayload(payload);
        })
        .catch(function (err) {
          if (document.getElementById("date").value === date) setStatus(err.message);
        });
    }

    document.getElementById("info-close").addEventListener("click", closeInfo);
    document.getElementById("info-modal").addEventListener("click", function (event) {
      if (event.target.id === "info-modal") closeInfo();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeInfo();
    });

    document.getElementById("prev").addEventListener("click", function () {
      load(shift(document.getElementById("date").value, -1));
    });
    document.getElementById("today").addEventListener("click", function () {
      load(todayBerlin());
    });
    document.getElementById("date").addEventListener("change", function (event) {
      if (event.target.value) load(event.target.value);
    });
    document.getElementById("date-text").addEventListener("change", commitGermanDate);
    document.getElementById("date-text").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        commitGermanDate();
      }
    });
    document.getElementById("date-pick").addEventListener("click", function (event) {
      event.stopPropagation();
      if (document.getElementById("date-pop").classList.contains("open")) closeDatePop();
      else openDatePop();
    });
    document.addEventListener("click", function (event) {
      if (!document.getElementById("date-pop").classList.contains("open")) return;
      if (!document.getElementById("date-control").contains(event.target)) closeDatePop();
    });

    function drainLocal(server) {
      var patch = {};
      try {
        var lang = localStorage.getItem("cloudwatcher-lang");
        var hiddenRaw = localStorage.getItem("cloudwatcher-hidden-fields");
        localStorage.removeItem("cloudwatcher-lang");
        localStorage.removeItem("cloudwatcher-hidden-fields");
        if (!server.lang && (lang === "de" || lang === "en")) patch.lang = lang;
        if ((!server.hidden || !server.hidden.length) && hiddenRaw) {
          var hidden = JSON.parse(hiddenRaw);
          if (hidden && hidden.length) patch.hidden = hidden;
        }
      } catch (err) {}
      return patch;
    }

    fetch("/api/settings")
      .then(function (response) { return response.json(); })
      .then(function (body) {
        settings = body;
        var patch = drainLocal(body);
        if (patch.lang) setLanguage(patch.lang);
        else if (body.lang) setLanguage(body.lang);
        applyI18n();
        syncDateControl();
        if (patch.lang || patch.hidden) return saveSettings(patch);
      })
      .catch(function () {})
      .then(function () { load(todayBerlin()); });
    paintLed();
    setInterval(paintLed, 1000);
    setInterval(function () {
      var date = document.getElementById("date").value;
      if (date) load(date, true);
    }, 15000);
  </script>
</body>
</html>
