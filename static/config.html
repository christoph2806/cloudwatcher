<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageSettings">CloudWatcher settings</title>
  <style>
    :root { color-scheme: dark; }
    html {
      height: 100%;
      background: #071018 url("/static/backdrop.jpg") center center / cover no-repeat fixed;
    }
    body {
      box-sizing: border-box;
      height: 100%;
      margin: 0 auto;
      max-width: 960px;
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #eef3f8;
      background: transparent;
    }
    .sticky-head {
      flex: 0 0 auto;
      margin: -16px -16px 0;
      padding: 16px 16px 12px;
      background: #071018 url("/static/backdrop.jpg") center center / cover no-repeat fixed;
    }
    .card-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding-top: 4px;
    }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { height: 2rem; width: auto; display: block; }
    h1 { font-size: 2rem; line-height: 1; margin: 0; color: #f4f7fb; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
    h2 { font-size: 1.05rem; margin: 20px 0 8px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
    a { color: #d6e8ff; }
    a.nav { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85); }
    #fields { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 8px; }
    #fields label { display: flex; align-items: center; gap: 6px; min-height: 32px; }
    fieldset {
      background: linear-gradient(to bottom, rgba(12, 20, 34, 0.97), rgba(32, 52, 80, 0.97));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      margin: 0 0 12px;
      padding: 12px;
    }
    .card-title { margin: 0 0 10px; font-size: 1rem; font-weight: 600; color: #f4f7fb; }
    .grid {
      display: grid;
      grid-template-columns: 14rem 9rem;
      column-gap: 12px;
      row-gap: 6px;
      align-items: center;
    }
    .name { display: flex; align-items: center; gap: 8px; }
    input[type="number"] {
      box-sizing: border-box;
      font: inherit;
      font-size: 16px;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 1px solid #6d7d90;
      border-radius: 6px;
      background: #152033;
      color: #eef3f8;
    }
    .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    button {
      font: inherit;
      font-size: 16px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid #6d7d90;
      border-radius: 8px;
      background: #152033;
      color: #eef3f8;
      cursor: pointer;
    }
    #msg { min-height: 1.4em; }
    .lang-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    select {
      box-sizing: border-box;
      font: inherit;
      font-size: 16px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #6d7d90;
      border-radius: 8px;
      background: #152033;
      color: #eef3f8;
    }
    .warning {
      margin: 10px 0 0;
      padding: 10px 12px;
      border: 1px solid #c9a24a;
      border-radius: 8px;
      background: rgba(48, 36, 12, 0.9);
      color: #ffe7b0;
      line-height: 1.4;
    }
    .credit, .credit a { color: #c8cdd4; font-size: 12px; text-align: center; }
    .credit { margin: 28px 0 8px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
    .credit a { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="sticky-head">
    <div class="top">
      <div class="brand">
        <img class="logo" src="/static/logo.png" alt="">
        <h1 data-i18n="settings">Settings</h1>
      </div>
      <a class="nav" href="/" data-i18n="charts">Charts</a>
    </div>
    <p class="lang-row">
      <label for="lang" data-i18n="language">Language</label>
      <select id="lang">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </p>
    <h2 data-i18n="diagrams">Charts</h2>
    <div id="fields"></div>
    <h2 data-i18n="limits">Limits</h2>
    <p data-i18n="limitsHelp">Defaults from the Solo. Empty fields are not drawn. A line far outside that day's values is omitted so the curve stays readable.</p>
    <p class="warning" data-i18n="limitsWarn">These settings are not sent to the CloudWatcher and only affect how the diagrams are displayed.</p>
    <p id="msg"></p>
  </div>
  <div class="card-scroll">
    <form id="form"></form>
    <p class="credit">Photo by <a href="https://unsplash.com/@scottagoodwill?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Scott Goodwill</a> on <a href="https://unsplash.com/photos/night-sky-with-milky-way-observatory-and-people-stargazing-dU4dX1l0UFM?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
  </div>
  <script src="/static/i18n.js"></script>
  <script>
    applyI18n();
    var settings = { limits: {}, hidden: [], lang: "" };
    var fieldList = [];

    function todayBerlin() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Berlin",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function hiddenSet() {
      return new Set(settings.hidden || []);
    }

    function saveHidden(hidden) {
      settings.hidden = Array.from(hidden);
      fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hidden: settings.hidden })
      }).then(function (response) { return response.json(); })
        .then(function (body) { settings = body; })
        .catch(function () {});
    }

    function fieldNames(series, order) {
      var names = Object.keys(series || {});
      (order || []).forEach(function (name) {
        if (names.indexOf(name) === -1) names.push(name);
      });
      hiddenSet().forEach(function (name) {
        if (names.indexOf(name) === -1) names.push(name);
      });
      var rank = {};
      (order || []).forEach(function (name, index) { rank[name] = index; });
      return names.sort(function (a, b) {
        var ra = Object.prototype.hasOwnProperty.call(rank, a) ? rank[a] : 10000;
        var rb = Object.prototype.hasOwnProperty.call(rank, b) ? rank[b] : 10000;
        if (ra !== rb) return ra - rb;
        return a < b ? -1 : a > b ? 1 : 0;
      });
    }

    function renderFields(names) {
      fieldList = names;
      var box = document.getElementById("fields");
      var hidden = hiddenSet();
      box.textContent = "";
      if (!names.length) {
        box.textContent = t("noFields");
        return;
      }
      names.forEach(function (name) {
        var label = document.createElement("label");
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !hidden.has(name);
        input.addEventListener("change", function () {
          if (input.checked) hidden.delete(name);
          else hidden.add(name);
          saveHidden(hidden);
        });
        label.appendChild(input);
        label.appendChild(document.createTextNode(name));
        box.appendChild(label);
      });
    }

    function inputValue(value) {
      return value == null ? "" : String(value);
    }

    function render(limits) {
      var form = document.getElementById("form");
      form.textContent = "";
      Object.keys(limits).forEach(function (field) {
        var spec = limits[field];
        var box = document.createElement("fieldset");
        box.dataset.field = field;
        var heading = document.createElement("h3");
        heading.className = "card-title";
        heading.textContent = fieldTitle(field, spec.title || field) + (spec.unit ? " (" + spec.unit + ")" : "");
        box.appendChild(heading);
        var grid = document.createElement("div");
        grid.className = "grid";
        function addRow(text, input, swatchColor) {
          var name = document.createElement("label");
          name.className = "name";
          name.htmlFor = input.id;
          var swatch = document.createElement("span");
          swatch.className = "swatch";
          if (swatchColor) swatch.style.background = swatchColor;
          else swatch.style.visibility = "hidden";
          name.appendChild(swatch);
          name.appendChild(document.createTextNode(text));
          grid.appendChild(name);
          grid.appendChild(input);
        }
        var ymax = document.createElement("input");
        ymax.type = "number";
        ymax.step = "any";
        ymax.id = field + "-ymax";
        ymax.dataset.role = "ymax";
        ymax.value = inputValue(spec.ymax);
        var ymin = document.createElement("input");
        ymin.type = "number";
        ymin.step = "any";
        ymin.id = field + "-ymin";
        ymin.dataset.role = "ymin";
        ymin.value = inputValue(spec.ymin);
        addRow(t("chartMin"), ymin, null);
        addRow(t("chartMax"), ymax, null);
        (spec.lines || []).forEach(function (line) {
          var input = document.createElement("input");
          input.type = "number";
          input.step = "any";
          input.id = field + "-" + line.id;
          input.dataset.role = "line";
          input.dataset.id = line.id;
          input.value = inputValue(line.value);
          addRow(limitName(field, line.id, line.label || line.id), input, line.color || "#666");
        });
        box.appendChild(grid);
        form.appendChild(box);
      });
    }

    function collect() {
      var limits = JSON.parse(JSON.stringify(settings.limits));
      document.querySelectorAll("fieldset").forEach(function (box) {
        var field = box.dataset.field;
        var spec = limits[field];
        if (!spec) return;
        var ymax = box.querySelector("[data-role=ymax]");
        var ymin = box.querySelector("[data-role=ymin]");
        spec.ymax = ymax.value === "" ? null : Number(ymax.value);
        spec.ymin = ymin.value === "" ? null : Number(ymin.value);
        box.querySelectorAll("[data-role=line]").forEach(function (input) {
          (spec.lines || []).forEach(function (line) {
            if (line.id === input.dataset.id) {
              line.value = input.value === "" ? null : Number(input.value);
            }
          });
        });
      });
      return limits;
    }

    var saveTimer = null;
    function saveLimits() {
      var msg = document.getElementById("msg");
      msg.textContent = t("saving");
      fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ limits: collect() })
      }).then(function (response) {
        if (!response.ok) throw new Error(t("saveFailed"));
        return response.json();
      }).then(function (body) {
        settings.limits = body.limits;
        msg.textContent = t("saved");
      }).catch(function (err) {
        msg.textContent = err.message;
      });
    }
    document.getElementById("form").addEventListener("focusout", function (event) {
      if (!event.target.matches("input")) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveLimits, 200);
    });

    var langSelect = document.getElementById("lang");
    langSelect.value = currentLang();
    langSelect.addEventListener("change", function () {
      setLanguage(langSelect.value);
      applyI18n();
      if (settings.limits) render(settings.limits);
      renderFields(fieldList);
      fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lang: langSelect.value })
      }).then(function (response) { return response.json(); })
        .then(function (body) { settings = body; })
        .catch(function () {});
    });

    fetch("/api/settings")
      .then(function (response) { return response.json(); })
      .then(function (body) {
        settings = body;
        try {
          var savedLang = localStorage.getItem("cloudwatcher-lang");
          var savedHidden = localStorage.getItem("cloudwatcher-hidden-fields");
          localStorage.removeItem("cloudwatcher-lang");
          localStorage.removeItem("cloudwatcher-hidden-fields");
          if (!body.lang && (savedLang === "de" || savedLang === "en")) body.lang = savedLang;
          if ((!body.hidden || !body.hidden.length) && savedHidden) {
            var parsed = JSON.parse(savedHidden);
            if (parsed && parsed.length) body.hidden = parsed;
          }
        } catch (err) {}
        if (body.lang) setLanguage(body.lang);
        langSelect.value = currentLang();
        applyI18n();
        render(body.limits);
        fetch("/api/data?date=" + encodeURIComponent(todayBerlin()))
          .then(function (response) { return response.json(); })
          .then(function (payload) {
            renderFields(fieldNames(payload.series, settings.order));
          })
          .catch(function () {
            renderFields(fieldNames({}, settings.order));
          });
      })
      .catch(function () {
        document.getElementById("msg").textContent = t("loadFailed");
      });
  </script>
</body>
</html>
