server {
    listen 80;
    listen [::]:80;
    server_name cloudwatcher.mussenbrock.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloudwatcher.mussenbrock.net;

    ssl_certificate /etc/letsencrypt/live/cloudwatcher.mussenbrock.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudwatcher.mussenbrock.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "CloudWatcher";
    auth_basic_user_file /etc/nginx/cloudwatcher.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
